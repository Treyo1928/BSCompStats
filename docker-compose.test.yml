# Throwaway data stores for the integration tests (scripts/test-integration.sh).
# Their own project, ports and RAM-only storage: they never touch a dev or
# production database, and everything is gone when they stop.
name: bscs-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bscs_test
      POSTGRES_PASSWORD: bscs_test
      POSTGRES_DB: bscs_test
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bscs_test -d bscs_test']
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:56379:6379'
